<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Anime Ranker (●'◡'●)</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="stylesheet" href="output.css">
		<script src="index.js"></script>
	</head>
	<body class="bg-gradient-to-tl from-gray-950 via-gray-900 to-gray-800 min-h-screen text-green-50">
		<div class="sticky mb-4 p-4">
			<h1 class="text-4xl text-center pt-4 pb-4 font-bold bg-purple-950 rounded-md" onclick="toIndex()">Anime Ranker V2</h1>
		</div>

		<div class="flex flex-row flex-wrap">
			<div class="basis-1/2 p-8">
				<div class="bg-gray-800 p-4 border-solid border-2 border-purple-500 rounded-lg min-h-full">
					Select the Trakt .csv file you want to rank
					<div class="size-6 inline float-end hover:text-green-400 hover:scale-110" onclick="openModal('Test','This is the test message',newRanker)">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
						</svg>
					</div>
						
					<div class="mt-2 mb-4 border-b-2 border-solid border-purple-900"></div>
					<label class="block">
						<input id="fileInput" type="file" accept=".csv" 
						class="p-4 block w-full text-sm text-slate-500
						  file:mr-4 file:py-2 file:px-4
						  file:rounded-full file:border-0
						  file:text-sm file:font-semibold
						  file:bg-purple-500 file:text-green-50
						  hover:file:bg-green-400 hover:file:scale-110
						"/>
					</label>
				</div>
				
			</div>
			<div class="basis-1/2 p-8">
				<div class="bg-gray-800 p-4 border-solid border-2 border-purple-500 rounded-lg min-h-full">
					Alternatively, you can continue a previous save
					<div class="size-6 inline float-end hover:text-green-400 hover:scale-110">
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
						</svg>
					</div>
					<div class="mt-2 mb-4 border-b-2 border-solid border-purple-900"></div>
					<div id="SaveList" class="flex flex-nowrap flex-col">
						<div class="flex text-slate-500 hover:text-green-50">
							<div class="flex-grow truncate">Really long save file name with date 10/10/2024</div>
							<div class="w-6 h-6 inline align-end hover:text-green-400 hover:scale-110">
								<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
								</svg>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
